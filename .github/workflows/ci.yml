name: ci

# 门禁 = 默认构型 + **feature 矩阵**。
#
# 为什么把 feature 矩阵放进同一个 job 且不可跳过：`gstreamer`（视频）与
# `gles`（GPU 转场）都是**非默认** feature，不带 `--features` 的
# `cargo test/clippy --workspace` 不会编译它们。
#
# 两个阶段各自打印明确结论（默认 feature 全绿 / 矩阵阶段完成），
# 不允许把前者当作整体通过。

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # 构建依赖：阶段 A 的 `cargo clippy --workspace --all-targets` 会编译
      # workspace 成员 liuguang-vaapi（非可选），它又牵连：
      #   - liuguang-media/gstreamer（非可选 feature）→ glib/gobject/gio + GStreamer 各 -dev
      #   - gbm（GBM 设备 + EGL）→ libgbm.so
      #   - liuguang-vaapi/build.rs 的 pkg-config 探测与 dlopen 链接 → libva / libav* / libdrm
      #   - gbm 的 wayland-server 依赖 → wayland-server.pc
      # 缺任一 -dev 包都会在 glib-sys / gbm-sys / build.rs 处直接失败（公开 main
      # 此前的 run 就挂在 `glib-2.0 was not found in the pkg-config search path`）。
      # `gstreamer1.0-vaapi` 必须装运行时包：liuguang-media/build.rs 用
      # `-l:libgstva-1.0.so.0` 按精确文件名链接（没有 -devel 的 `.so` 符号链接）。
      # GUI 是独立 workspace（apps/liuguang-gui），本 job 不编译，故不装 GTK4。
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgbm-dev \
            libwayland-dev \
            libdrm-dev \
            libva-dev \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            gstreamer1.0-vaapi \
            gstreamer1.0-plugins-base

      # 阶段 A：默认 feature 构型
      - name: 阶段 A — fmt
        run: cargo fmt --check
      - name: 阶段 A — clippy（默认构型）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 阶段 A — test（默认构型）
        run: cargo test --workspace
      - name: 阶段 A — 结论
        run: echo "✅ 默认 feature 全绿（不含 gstreamer / gles）"

      # 阶段 B：feature 矩阵（不可跳过）
      - name: 阶段 B — liuguang-media（gstreamer）
        run: |
          cargo test -p liuguang-media --features gstreamer
          cargo clippy -p liuguang-media --features gstreamer --all-targets -- -D warnings
      - name: 阶段 B — liuguang（gstreamer）
        run: cargo check -p liuguang --features gstreamer
      - name: 阶段 B — liuguang-render（gles）
        run: |
          cargo test -p liuguang-render --features gles
          cargo clippy -p liuguang-render --features gles --all-targets -- -D warnings
      - name: 阶段 B — 结论
        run: echo "✅ feature 矩阵全绿（gstreamer + gles）"
