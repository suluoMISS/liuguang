<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#0A1024"/>
      <stop offset="0.45" stop-color="#0E1730"/>
      <stop offset="1" stop-color="#080C1C"/>
    </linearGradient>
    <radialGradient id="liuguang" cx="0.68" cy="0.28" r="0.72">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#6366F1" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0A1024" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="r1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="0.62" stop-color="#818CF8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#2DD4BF" stop-opacity="0.8"/>
      <stop offset="0.7" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="r3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C084FC" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#C084FC" stop-opacity="0.55"/>
      <stop offset="0.8" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="play" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#ECFEFF"/>
      <stop offset="1" stop-color="#B7EEFF"/>
    </linearGradient>
    <radialGradient id="playGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.40"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.16"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="soft16" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="playShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#001018" flood-opacity="0.55"/>
    </filter>
    <clipPath id="sq">
      <path d="M 136 20 H 376 C 440 20 492 72 492 136 V 376 C 492 440 440 492 376 492 H 136 C 72 492 20 440 20 376 V 136 C 20 72 72 20 136 20 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <rect width="512" height="512" fill="url(#liuguang)"/>

    <!-- 背景丝带：柔和、两端渐隐，不交叉成怪形状 -->
    <g filter="url(#soft16)">
      <path d="M -30 190 C 90 130, 200 250, 300 200 C 380 160, 460 200, 545 170"
            fill="none" stroke="url(#r3)" stroke-width="54" stroke-linecap="round"/>
      <path d="M -30 300 C 100 240, 210 350, 320 300 C 400 262, 470 300, 545 285"
            fill="none" stroke="url(#r1)" stroke-width="70" stroke-linecap="round"/>
      <path d="M -30 400 C 90 350, 200 440, 310 390 C 400 350, 470 380, 545 370"
            fill="none" stroke="url(#r2)" stroke-width="60" stroke-linecap="round"/>
    </g>
    <g opacity="0.55">
      <path d="M -30 300 C 100 240, 210 350, 320 300 C 400 262, 470 300, 545 285"
            fill="none" stroke="url(#r1)" stroke-width="22" stroke-linecap="round"/>
      <path d="M -30 190 C 90 130, 200 250, 300 200 C 380 160, 460 200, 545 170"
            fill="none" stroke="url(#r3)" stroke-width="14" stroke-linecap="round"/>
    </g>

    <!-- 播放三角：居中、柔和发光、右下微冷 -->
    <ellipse cx="272" cy="256" rx="150" ry="130" fill="url(#playGlow)"/>
    <g filter="url(#playShadow)">
      <path d="M 214 172 L 214 340 L 356 256 Z"
            fill="url(#play)" stroke="url(#play)" stroke-width="30" stroke-linejoin="round"/>
    </g>

    <rect width="512" height="512" fill="url(#vig)"/>
  </g>
  <path d="M 136 20 H 376 C 440 20 492 72 492 136 V 376 C 492 440 440 492 376 492 H 136 C 72 492 20 440 20 376 V 136 C 20 72 72 20 136 20 Z"
        fill="none" stroke="url(#rim)" stroke-width="5"/>
</svg>
