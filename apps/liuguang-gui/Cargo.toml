[package]
name = "liuguang-gui"
description = "流光（Liuguang） 桌面壁纸配置 GUI（GTK4；独立于守护进程，通过 IPC 控制）"
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/suluoMISS/liuguang"
rust-version = "1.85"
publish = false
autobins = false

[[bin]]
name = "liuguang-gui"
path = "src/main.rs"

# 这棵子树**不在** workspace 里：GTK4 需要系统开发包（gtk4-devel），
# 而守护进程/CLI/CI 要能在没有 GTK 的服务器上构建。见 scripts/build-gui.sh。
[workspace]

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
gdk-pixbuf = "0.21"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
liuguang-core = { path = "../../crates/liuguang-core", features = ["cli"] }
liuguang-ipc = { path = "../../crates/liuguang-ipc" }

[lints.rust]
unsafe_code = "deny"

[package.metadata.deb]
maintainer = "suluoMISS <suluoMISS@users.noreply.github.com>"
copyright = "2026, suluoMISS (Liuguang Contributors)"
license-file = ["../../LICENSE", "0"]
section = "x11"
priority = "optional"
depends = "liuguang, libgtk-4-1, libadwaita-1-0, libgdk-pixbuf-2.0-0"
assets = [
  ["target/release/liuguang-gui", "usr/bin/liuguang-gui", "755"],
  ["../../packaging/liuguang-gui.desktop", "usr/share/applications/liuguang-gui.desktop", "644"],
  ["../../packaging/icons/liuguang.svg", "usr/share/icons/hicolor/scalable/apps/liuguang.svg", "644"],
  ["../../packaging/icons/liuguang-16.png", "usr/share/icons/hicolor/16x16/apps/liuguang.png", "644"],
  ["../../packaging/icons/liuguang-24.png", "usr/share/icons/hicolor/24x24/apps/liuguang.png", "644"],
  ["../../packaging/icons/liuguang-32.png", "usr/share/icons/hicolor/32x32/apps/liuguang.png", "644"],
  ["../../packaging/icons/liuguang-48.png", "usr/share/icons/hicolor/48x48/apps/liuguang.png", "644"],
  ["../../packaging/icons/liuguang-64.png", "usr/share/icons/hicolor/64x64/apps/liuguang.png", "644"],
  ["../../packaging/icons/liuguang-128.png", "usr/share/icons/hicolor/128x128/apps/liuguang.png", "644"],
  ["../../packaging/icons/liuguang-256.png", "usr/share/icons/hicolor/256x256/apps/liuguang.png", "644"],
  ["../../packaging/icons/liuguang-512.png", "usr/share/icons/hicolor/512x512/apps/liuguang.png", "644"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/liuguang-gui", dest = "/usr/bin/liuguang-gui", mode = "755" },
  { source = "../../packaging/liuguang-gui.desktop", dest = "/usr/share/applications/liuguang-gui.desktop", mode = "644" },
  { source = "../../packaging/icons/liuguang.svg", dest = "/usr/share/icons/hicolor/scalable/apps/liuguang.svg", mode = "644" },
  { source = "../../packaging/icons/liuguang-16.png", dest = "/usr/share/icons/hicolor/16x16/apps/liuguang.png", mode = "644" },
  { source = "../../packaging/icons/liuguang-24.png", dest = "/usr/share/icons/hicolor/24x24/apps/liuguang.png", mode = "644" },
  { source = "../../packaging/icons/liuguang-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/liuguang.png", mode = "644" },
  { source = "../../packaging/icons/liuguang-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/liuguang.png", mode = "644" },
  { source = "../../packaging/icons/liuguang-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/liuguang.png", mode = "644" },
  { source = "../../packaging/icons/liuguang-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/liuguang.png", mode = "644" },
  { source = "../../packaging/icons/liuguang-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/liuguang.png", mode = "644" },
  { source = "../../packaging/icons/liuguang-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/liuguang.png", mode = "644" },
  { source = "../../LICENSE", dest = "/usr/share/licenses/liuguang-gui/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
liuguang = "*"
gtk4 = "*"
libadwaita = "*"
gdk-pixbuf2 = "*"
